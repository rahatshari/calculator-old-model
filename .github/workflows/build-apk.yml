name: Build and Release Offline Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Offline APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure Keystore is Ready
        run: |
          mkdir -p app
          if [ ! -f app/release.keystore ] || [ ! -s app/release.keystore ]; then
            echo "Generating valid release.keystore..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias calculatorKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=Calculator, OU=Mobile, O=LandWood, L=Dhaka, ST=Dhaka, C=BD"
          else
            echo "Using existing persistent keystore at app/release.keystore"
          fi
          cp -f app/release.keystore release.keystore 2>/dev/null || true

      - name: Build Signed Offline APK with Automatic Version Bump
        id: build_apk
        run: |
          set +e
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "Building offline Android APK version $VERSION_NAME (code: $VERSION_CODE)"
          
          # Guarantee all latest web assets are bundled inside the offline APK assets directory
          mkdir -p app/src/main/assets
          cp -f index.html icon.png icon-192.png icon-512.png manifest.json app/src/main/assets/ 2>/dev/null || true
          
          # Build release APK, fall back to debug if release signing has environment quirks
          ./gradlew assembleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-daemon \
            --stacktrace
          BUILD_STATUS=$?

          if [ $BUILD_STATUS -ne 0 ]; then
            echo "assembleRelease failed (code $BUILD_STATUS), building assembleDebug as robust fallback..."
            ./gradlew assembleDebug \
              -PversionCode="$VERSION_CODE" \
              -PversionName="$VERSION_NAME" \
              --no-daemon \
              --stacktrace
          else
            echo "Signed Release APK build succeeded!"
          fi
          set -e
          
          mkdir -p release_assets
          FOUND_APK=$(find app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "Error: No APK found in app/build/outputs/apk"
            exit 1
          fi
          echo "Found generated APK: $FOUND_APK"
          cp -f "$FOUND_APK" release_assets/calculator-v${VERSION_NAME}.apk
          cp -f "$FOUND_APK" release_assets/calculator-latest.apk
          
          cat <<EOF > release_assets/version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/calculator-latest.apk",
            "releasePage": "https://github.com/${{ github.repository }}/releases/latest",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "changelog": "স্বয়ংক্রিয় আপডেট: জমি, নল, মাটি ও কাঠের পরিমাপক অফলাইন APK।"
          }
          EOF

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Land-Wood-Calculator-v1.0.${{ github.run_number }}-APK
          path: release_assets/calculator-latest.apk

      - name: Publish GitHub Release (with Direct Download APK)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 জমি ও কাঠ পরিমাপ - অফলাইন অ্যান্ড্রয়েড APK (v1.0.${{ github.run_number }})
            
            এই APK-টি সম্পূর্ণ অফলাইন — কোনো ইন্টারনেট সংযোগ ছাড়াই সব হিসাব এবং প্রিন্ট রিপোর্ট তৈরি করতে পারবেন।
            
            ### 📥 সরাসরি ডাউনলোড লিংক:
            * **[calculator-latest.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/calculator-latest.apk)** *(সর্বশেষ সংস্করণের সরাসরি ইনস্টলার)*
            * **[calculator-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/calculator-v1.0.${{ github.run_number }}.apk)**
            
            ---
            * **Version Code**: `${{ github.run_number }}`
            * **Version Name**: `1.0.${{ github.run_number }}`
            * **Type**: সম্পূর্ণ অফলাইন (100% Offline Embedded WebApp)
            * **Signature**: একই পারসিস্টেন্ট কীস্টোর দ্বারা সাইন করা — আনইনস্টল না করেই সরাসরি আপডেট করা যাবে।
          files: |
            release_assets/calculator-latest.apk
            release_assets/calculator-v1.0.${{ github.run_number }}.apk
            release_assets/version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
